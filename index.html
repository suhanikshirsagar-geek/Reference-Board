<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RefBoard — Store References</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream:    #FAF8F3;
  --cream2:   #F3EFE6;
  --cream3:   #EAE4D8;
  --ink:      #0E0D0B;
  --ink2:     #2C2A26;
  --ink3:     #5A5650;
  --ink4:     #8A8680;
  --gold:     #B8962E;
  --gold-lt:  #E8D48A;
  --gold-dim: rgba(184,150,46,0.12);
  --gold-dim2:rgba(184,150,46,0.06);
  --rule:     rgba(14,13,11,0.1);
  --rule2:    rgba(14,13,11,0.06);
  --shadow:   0 2px 12px rgba(14,13,11,0.06);
  --shadow-md:0 6px 24px rgba(14,13,11,0.10);
  --shadow-lg:0 16px 48px rgba(14,13,11,0.14);
  --serif:    'Cormorant Garamond', Georgia, serif;
  --sans:     'DM Sans', system-ui, sans-serif;
  --mono:     'DM Mono', monospace;
  --r:        4px;
  --rl:       6px;

  --theme-bg:     rgba(90,86,80,0.08);
  --theme-color:  #5A5650;
  --theme-border: rgba(90,86,80,0.22);

  /* Sheet type colours */
  --func-web-bg:    rgba(100,140,200,0.10);
  --func-web-color: #2D4A8A;
  --func-web-border:rgba(100,140,200,0.28);
  --func-app-bg:    rgba(80,160,100,0.10);
  --func-app-color: #1A6635;
  --func-app-border:rgba(80,160,100,0.28);
  --func-api-bg:    rgba(160,80,180,0.10);
  --func-api-color: #6A1A80;
  --func-api-border:rgba(160,80,180,0.28);

  /* Plus store */
  --plus-bg:    rgba(34,130,60,0.10);
  --plus-color: #1A6A30;
  --plus-border:rgba(34,130,60,0.28);

  --cat-clothing: #D4A88A;
  --cat-sports:   #8AAF8A;
  --cat-health:   #C4A0B8;
  --cat-home:     #C4B88A;
  --cat-tech:     #8AAFC4;
  --cat-food:     #A8C48A;
  --cat-baby:     #D4C48A;
  --cat-pets:     #A88AC4;
  --cat-jewelry:  #C4A870;
  --cat-arts:     #C48AA0;
  --cat-books:    #8AC4B8;
  --cat-auto:     #A0A8B8;
  --cat-biz:      #B8B0A0;
  --cat-travel:   #8AB8D4;
  --cat-other:    #C4C0B8;
}

html { scroll-behavior: smooth; }
body { background: var(--cream); color: var(--ink); font-family: var(--sans); min-height: 100vh; font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }

:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

/* ── HEADER ── */
.hdr {
  position: sticky; top: 0; z-index: 200;
  background: rgba(250,248,243,0.96); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
  padding: 0 32px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 32px;
  height: 68px;
}
.logo {
  font-family: var(--serif); font-size: 22px; font-weight: 400;
  color: var(--ink); letter-spacing: 0.04em; white-space: nowrap;
  text-decoration: none; display: flex; align-items: baseline; gap: 3px;
}
.logo-dot { color: var(--gold); font-size: 28px; line-height: 0; position: relative; top: 4px; }

.hdr-search { position: relative; }
.hdr-search input {
  width: 100%; background: transparent;
  border: none; border-bottom: 1px solid var(--rule2);
  padding: 8px 12px 8px 28px;
  color: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 300;
  outline: none; transition: border-color 0.3s;
  letter-spacing: 0.02em;
}
.hdr-search input:focus { border-bottom-color: var(--gold); }
.hdr-search input::placeholder { color: var(--ink4); }
.si { position: absolute; left: 4px; top: 50%; transform: translateY(-50%); color: var(--ink4); pointer-events: none; }
.si svg { width: 13px; height: 13px; }

.hdr-right { display: flex; align-items: center; gap: 20px; }
.hdr-count { font-family: var(--mono); font-size: 11px; color: var(--ink4); letter-spacing: 0.04em; white-space: nowrap; }
.hdr-count strong { color: var(--ink2); }

.btn-add {
  display: flex; align-items: center; gap: 6px;
  background: var(--ink); color: var(--cream);
  border: none; border-radius: 2px;
  padding: 9px 18px;
  font-family: var(--sans); font-size: 12px; font-weight: 400;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: background 0.2s, transform 0.15s;
  white-space: nowrap;
}
.btn-add:hover { background: var(--ink2); transform: translateY(-1px); }
.btn-add svg { width: 12px; height: 12px; }

/* ── LAYOUT ── */
.layout { display: flex; min-height: calc(100vh - 68px); }

/* ── SIDEBAR ── */
.sidebar {
  width: 224px; min-width: 224px;
  background: transparent;
  border-right: 1px solid var(--rule);
  padding: 28px 0 60px;
  position: sticky; top: 68px; height: calc(100vh - 68px);
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 2px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--rule); }

.sb-sec { padding: 0 20px 0; }
.sb-sec-body { padding-bottom: 20px; overflow: hidden; transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.22s ease; }
.sb-sec-body.collapsed { max-height: 0 !important; opacity: 0; pointer-events: none; padding-bottom: 0; }

.sb-lbl {
  font-family: var(--mono); font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--ink4);
  padding: 10px 2px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--rule2); margin-bottom: 0;
  cursor: pointer; width: 100%; background: none; border-left: none; border-right: none; border-top: none;
  transition: color 0.15s;
}
.sb-lbl:hover { color: var(--ink2); }
.sb-lbl-text { flex: 1; }
.sb-lbl-active { display: inline-block; background: var(--gold); color: var(--cream); font-size: 8px; padding: 1px 5px; border-radius: 1px; margin-left: 5px; vertical-align: middle; }
.sb-chevron { font-size: 8px; transition: transform 0.25s ease; opacity: 0.5; }
.sb-lbl.open .sb-chevron { transform: rotate(180deg); }

.fb {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 5px 4px; background: none; border: none;
  color: var(--ink3); font-family: var(--sans); font-size: 12px; font-weight: 300;
  cursor: pointer; border-radius: 2px; transition: color 0.15s; text-align: left;
  letter-spacing: 0.01em;
}
.fb:hover { color: var(--ink); }
.fb.on { color: var(--gold); font-weight: 400; }
.fb .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; opacity: 0.7; }
.fb.on .dot { opacity: 1; }
.fb .cnt { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--ink4); }
.fb.on .cnt { color: var(--gold); }
.fb .ico { font-size: 12px; flex-shrink: 0; line-height: 1; opacity: 0.75; }
.fb .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

/* Sheet type filter pills */
.sheet-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.sheet-pill {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 2px; border: 1px solid var(--rule2);
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 0.15s; background: transparent; color: var(--ink4);
}
.sheet-pill:hover { border-color: var(--ink3); color: var(--ink2); }
.sheet-pill.on[data-st="website"]  { background: var(--func-web-bg); color: var(--func-web-color); border-color: var(--func-web-border); }
.sheet-pill.on[data-st="app"]      { background: var(--func-app-bg); color: var(--func-app-color); border-color: var(--func-app-border); }
.sheet-pill.on[data-st="api"]      { background: var(--func-api-bg); color: var(--func-api-color); border-color: var(--func-api-border); }
.sheet-pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* Func filter — collapsible with show-more */
.func-list { display: flex; flex-direction: column; gap: 1px; }
.func-more-btn {
  width: 100%; padding: 5px 4px; background: none; border: none;
  color: var(--ink4); font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  text-align: left; transition: color 0.15s; margin-top: 4px;
}
.func-more-btn:hover { color: var(--gold); }

.sort-sel {
  width: 100%; background: transparent; border: none;
  border-bottom: 1px solid var(--rule2);
  color: var(--ink2); font-family: var(--sans); font-size: 12px; font-weight: 300;
  padding: 6px 4px; outline: none; cursor: pointer; letter-spacing: 0.01em;
  transition: border-color 0.2s;
}
.sort-sel:focus { border-bottom-color: var(--gold); }
.sort-sel option { background: var(--cream); color: var(--ink); }

.clear-all {
  margin: 8px 20px 0; width: calc(100% - 40px);
  padding: 7px 4px; background: none; border: none; border-bottom: 1px solid var(--rule2);
  color: var(--ink4); font-size: 11px; font-family: var(--sans); letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; transition: color 0.15s; text-align: left;
}
.clear-all:hover { color: var(--gold); border-bottom-color: var(--gold); }

/* ── MAIN ── */
.main { flex: 1; padding: 28px 32px; min-width: 0; }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 28px; border-bottom: 1px solid var(--rule); }
.tab {
  padding: 10px 24px 10px 0; background: none; border: none; color: var(--ink4);
  font-family: var(--serif); font-size: 16px; font-weight: 400; cursor: pointer;
  border-bottom: 1.5px solid transparent; margin-bottom: -1px;
  transition: all 0.2s; letter-spacing: 0.02em;
}
.tab:hover { color: var(--ink2); }
.tab.on { color: var(--ink); border-bottom-color: var(--gold); }
.tbadge {
  display: inline-block; background: var(--gold); color: var(--cream);
  font-size: 9px; font-family: var(--mono); font-weight: 400;
  padding: 1px 6px; border-radius: 1px; margin-left: 6px;
  letter-spacing: 0.06em; vertical-align: middle; position: relative; top: -1px;
}
.tab:not(.on) .tbadge { background: var(--cream3); color: var(--ink4); }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.result-count { font-family: var(--mono); font-size: 11px; color: var(--ink4); flex: 1; letter-spacing: 0.04em; }
.result-count strong { color: var(--ink2); }
.btn-select {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; background: transparent; border: 1px solid var(--rule);
  color: var(--ink3); font-family: var(--sans); font-size: 11px; font-weight: 400;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s; border-radius: 1px;
}
.btn-select:hover { border-color: var(--gold); color: var(--gold); }
.btn-select.on { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.vbtns { display: flex; gap: 8px; }
.vbtn { padding: 4px 8px; background: none; border: none; color: var(--ink4); cursor: pointer; font-size: 16px; transition: color 0.15s; }
.vbtn.on { color: var(--ink); }

/* ── MASONRY ── */
#masonry { columns: 4 220px; column-gap: 16px; }
#masonry.lv { columns: 1; }

/* ── CARD ── */
.card {
  break-inside: avoid; margin-bottom: 16px;
  background: #fff;
  border: 1px solid var(--rule);
  border-radius: var(--rl);
  position: relative; cursor: pointer;
  transition: box-shadow 0.25s, transform 0.2s, border-color 0.2s;
  animation: cardIn 0.35s ease both;
  overflow: hidden;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: rgba(14,13,11,0.14); }
.card.fav { border-color: var(--gold-lt); }
.card.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim); }
.card.func-only { border-style: dashed; background: var(--cream); }
.card.is-plus { border-color: rgba(34,130,60,0.35); }
.card.is-plus:hover { border-color: rgba(34,130,60,0.6); }

/* Plus star badge */
.plus-star {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; color: var(--plus-color);
  background: var(--plus-bg); border: 1px solid var(--plus-border);
  padding: 1px 7px; border-radius: 1px;
  font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 6px;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.card-rule { height: 3px; width: 100%; }

.card-body { padding: 16px; }

.card-actions {
  position: absolute; top: 10px; right: 10px;
  display: flex; gap: 5px;
  opacity: 0; transition: opacity 0.18s;
  pointer-events: none;
}
.card:hover .card-actions,
.card.sel .card-actions,
.card.fav .card-actions { opacity: 1; pointer-events: all; }

.act-btn {
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff; border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform 0.15s, background 0.15s;
  color: var(--ink4);
}
.act-btn:hover { transform: scale(1.08); }
.act-btn.fav-on { color: var(--gold); border-color: var(--gold-lt); }
.act-btn.sel-on { background: var(--ink); color: var(--cream); border-color: var(--ink); }

.card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.card-ico {
  width: 32px; height: 32px; border-radius: 4px;
  background: var(--cream2); border: 1px solid var(--rule2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
  font-family: var(--serif); font-size: 13px; font-weight: 600;
  color: var(--ink3); letter-spacing: 0.04em;
}
.card-ico img { width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.card-names { flex: 1; min-width: 0; }
.card-name {
  font-family: var(--serif); font-size: 15px; font-weight: 400;
  color: var(--ink); line-height: 1.2; letter-spacing: 0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-transform: capitalize;
}
.card-url { font-family: var(--mono); font-size: 9px; color: var(--ink4); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.02em; }

.card-div { height: 1px; background: var(--rule2); margin: 10px 0; }

.cats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.cp {
  font-family: var(--mono); font-size: 9px; padding: 2px 7px;
  border-radius: 1px; letter-spacing: 0.06em; text-transform: uppercase;
}
.cl1 { background: var(--cream2); color: var(--ink3); border: 1px solid var(--rule2); }
.cl2 { background: transparent; color: var(--ink4); border: 1px solid var(--rule2); }
.cl3 { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(184,150,46,0.2); font-weight: 500; }

.ctags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 10px; }
.ctag { font-size: 10px; padding: 2px 6px; background: var(--cream2); color: var(--ink4); font-family: var(--mono); border-radius: 1px; }

/* Theme badge on card */
.theme-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 9px;
  padding: 2px 8px; border-radius: 1px;
  background: var(--theme-bg); color: var(--theme-color);
  border: 1px solid var(--theme-border);
  letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 6px; cursor: pointer; transition: all 0.15s;
}
.theme-badge:hover { background: var(--gold-dim); color: var(--gold); border-color: rgba(184,150,46,0.3); }
.theme-badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

/* Functionality badges on card */
.func-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.func-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 9px;
  padding: 2px 7px; border-radius: 1px;
  letter-spacing: 0.05em; text-transform: uppercase;
  cursor: pointer; transition: all 0.15s;
  max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.func-badge[data-st="website"] { background: var(--func-web-bg); color: var(--func-web-color); border: 1px solid var(--func-web-border); }
.func-badge[data-st="app"]     { background: var(--func-app-bg); color: var(--func-app-color); border: 1px solid var(--func-app-border); }
.func-badge[data-st="api"]     { background: var(--func-api-bg); color: var(--func-api-color); border: 1px solid var(--func-api-border); }
.func-badge:hover { opacity: 0.75; }
.func-badge-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.card-foot { display: flex; align-items: center; gap: 6px; }
.hbadge {
  font-family: var(--mono); font-size: 9px; padding: 2px 8px; border-radius: 1px;
  letter-spacing: 0.08em; text-transform: uppercase;
  display: flex; align-items: center; gap: 4px; font-weight: 400;
}
.cbadge { font-family: var(--mono); font-size: 9px; padding: 2px 8px; border-radius: 1px; letter-spacing: 0.08em; text-transform: uppercase; margin-left: auto; }
.h-active { background: #EEF7EE; color: #2D6A2D; }
.h-redirect { background: #EEF3FB; color: #2D4A8A; }
.c-high { background: #EEF7EE; color: #2D6A2D; }
.c-medium { background: #FDF7EE; color: #7A5A1A; }
.c-low { background: #FDF0EE; color: #8A2D2D; }

/* List view */
.lv .card { margin-bottom: 8px; }
.lv .card-body { display: flex; align-items: center; gap: 20px; padding: 12px 16px; flex-wrap: nowrap; }
.lv .card-rule { display: none; }
.lv .card-top { margin-bottom: 0; flex: 0 0 200px; }
.lv .card-div { display: none; }
.lv .cats { margin-bottom: 0; flex: 1; }
.lv .ctags { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 0; max-width: 300px; }
.card-foot { display: none; }
.lv .card-foot { display: flex; flex: 0 0 auto; }
.lv .theme-badge { margin-bottom: 0; }
.lv .func-badges { margin-bottom: 0; flex-wrap: nowrap; overflow: hidden; max-width: 220px; }
.btn-visit { font-family: var(--mono); font-size: 10px; padding: 5px 12px; border-radius: 2px; border: 1px solid var(--rule); background: var(--cream); color: var(--ink3); text-decoration: none; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s; }
.btn-visit:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }

/* ── MULTI-SELECT BAR ── */
.sel-bar {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink); color: var(--cream);
  border-radius: 2px; padding: 14px 28px;
  display: flex; align-items: center; gap: 20px;
  box-shadow: var(--shadow-lg); z-index: 300;
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.sel-bar.show { transform: translateX(-50%) translateY(0); }
.sel-count { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
.sel-count span { color: var(--gold); }
.sel-divider { width: 1px; height: 16px; background: rgba(250,248,243,0.15); }
.sel-btn {
  background: none; border: none; color: var(--cream); font-family: var(--sans);
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; padding: 4px 8px; border-radius: 1px; transition: background 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.sel-btn:hover { background: rgba(250,248,243,0.08); }
.sel-btn.primary { background: var(--gold); color: var(--ink); border-radius: 1px; padding: 6px 16px; }
.sel-btn.primary:hover { background: var(--gold-lt); }
.sel-btn svg { width: 12px; height: 12px; }

/* ── LOAD MORE ── */
.load-more { text-align: center; padding: 32px 0 16px; }
.load-btn {
  padding: 11px 36px; background: transparent; border: 1px solid var(--rule);
  color: var(--ink3); font-family: var(--sans); font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s; border-radius: 1px;
}
.load-btn:hover { border-color: var(--gold); color: var(--gold); }

/* ── EMPTY ── */
.empty { text-align: center; padding: 80px 20px; color: var(--ink4); }
.empty-ico { font-family: var(--serif); font-size: 48px; color: var(--cream3); margin-bottom: 16px; }
.empty-title { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--ink2); margin-bottom: 8px; letter-spacing: 0.04em; }
.empty-sub { font-family: var(--mono); font-size: 11px; color: var(--ink4); letter-spacing: 0.06em; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(14,13,11,0.4); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--cream); border: 1px solid var(--rule);
  border-radius: var(--rl); padding: 36px;
  max-width: 580px; width: 100%; max-height: 86vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(16px) scale(0.98);
  transition: transform 0.3s cubic-bezier(0.34, 1.3, 0.64, 1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--rule2); }
.modal-title { font-family: var(--serif); font-size: 24px; font-weight: 300; color: var(--ink); letter-spacing: 0.02em; text-transform: capitalize; line-height: 1.2; }
.modal-close { width: 28px; height: 28px; background: none; border: 1px solid var(--rule); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink4); font-size: 14px; transition: all 0.15s; flex-shrink: 0; margin-top: 4px; }
.modal-close:hover { border-color: var(--ink3); color: var(--ink); }

.d-url-block { margin-bottom: 24px; }
.d-url-main {
  font-family: var(--serif); font-size: 13px; color: var(--gold);
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  letter-spacing: 0.02em; border-bottom: 1px solid transparent;
  transition: border-color 0.2s; word-break: break-all;
}
.d-url-main:hover { border-bottom-color: var(--gold); }
.d-url-orig { font-family: var(--mono); font-size: 10px; color: var(--ink4); margin-top: 4px; letter-spacing: 0.04em; }

.d-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.d-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border: 1px solid var(--rule);
  font-family: var(--sans); font-size: 11px; font-weight: 400;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s; text-decoration: none;
  border-radius: 1px; color: var(--ink2); background: transparent;
}
.d-link:hover { border-color: var(--gold); color: var(--gold); }
.d-link.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.d-link.primary:hover { background: var(--ink2); }
.d-link svg { width: 10px; height: 10px; }

.d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin-bottom: 24px; }
.d-field { }
.d-lbl { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink4); margin-bottom: 4px; }
.d-val { font-size: 13px; color: var(--ink2); font-weight: 300; }

.d-tags-wrap { margin-bottom: 20px; }
.d-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.d-tag { font-family: var(--mono); font-size: 10px; padding: 3px 10px; background: var(--cream2); color: var(--ink3); border-radius: 1px; letter-spacing: 0.04em; }

/* Functionality section in detail modal */
.d-func-section { margin-bottom: 24px; }
.d-func-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.d-func-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 14px;
  border-radius: 3px; border: 1px solid var(--rule2);
  background: var(--cream2);
}
.d-func-item[data-st="website"] { border-left: 3px solid var(--func-web-color); }
.d-func-item[data-st="app"]     { border-left: 3px solid var(--func-app-color); }
.d-func-item[data-st="api"]     { border-left: 3px solid var(--func-api-color); }
.d-func-name { font-size: 12px; font-weight: 400; color: var(--ink2); flex: 1; letter-spacing: 0.01em; }
.d-func-meta { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.d-func-st {
  font-family: var(--mono); font-size: 9px; padding: 1px 6px;
  border-radius: 1px; letter-spacing: 0.06em; text-transform: uppercase;
}
.d-func-st[data-st="website"] { background: var(--func-web-bg); color: var(--func-web-color); border: 1px solid var(--func-web-border); }
.d-func-st[data-st="app"]     { background: var(--func-app-bg); color: var(--func-app-color); border: 1px solid var(--func-app-border); }
.d-func-st[data-st="api"]     { background: var(--func-api-bg); color: var(--func-api-color); border: 1px solid var(--func-api-border); }
.d-func-link {
  font-family: var(--mono); font-size: 9px; color: var(--gold);
  text-decoration: none; letter-spacing: 0.04em;
  padding: 1px 6px; border: 1px solid rgba(184,150,46,0.3);
  border-radius: 1px; white-space: nowrap;
}
.d-func-link:hover { background: var(--gold-dim); }

.d-notes { background: var(--cream2); border-left: 2px solid var(--gold); padding: 14px 16px; font-size: 13px; font-weight: 300; color: var(--ink2); line-height: 1.7; margin-bottom: 24px; letter-spacing: 0.01em; font-family: var(--serif); font-style: italic; }

.modal-actions { display: flex; gap: 10px; padding-top: 20px; border-top: 1px solid var(--rule2); flex-wrap: wrap; }
.btn-p { padding: 9px 22px; background: var(--ink); color: var(--cream); border: none; font-family: var(--sans); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.15s; border-radius: 1px; }
.btn-p:hover { background: var(--ink2); }
.btn-s { padding: 9px 18px; background: none; border: 1px solid var(--rule); color: var(--ink3); font-family: var(--sans); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; border-radius: 1px; }
.btn-s:hover { border-color: var(--gold); color: var(--gold); }
.btn-del { padding: 9px 18px; background: none; border: 1px solid #E8CACA; color: #8A2D2D; font-family: var(--sans); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; border-radius: 1px; margin-left: auto; }
.btn-del:hover { background: #FDF0EE; border-color: #C44444; }

/* Add form */
.form-field { margin-bottom: 20px; }
.form-lbl { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink4); display: block; margin-bottom: 7px; }
.form-input, .form-sel, .form-ta {
  width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--rule2);
  padding: 8px 4px; color: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 300;
  outline: none; transition: border-color 0.2s; letter-spacing: 0.01em;
}
.form-input:focus, .form-sel:focus, .form-ta:focus { border-bottom-color: var(--gold); }
.form-input::placeholder, .form-ta::placeholder { color: var(--ink4); }
.form-ta { resize: vertical; min-height: 72px; }
.form-sel { appearance: none; cursor: pointer; }
.form-sel option { background: var(--cream); }
.form-hint { font-family: var(--mono); font-size: 10px; color: var(--ink4); margin-top: 5px; letter-spacing: 0.04em; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.confirm-box { text-align: center; padding: 8px 0 0; }
.confirm-ico { font-size: 32px; margin-bottom: 16px; opacity: 0.5; }
.confirm-title { font-family: var(--serif); font-size: 20px; font-weight: 300; color: var(--ink); margin-bottom: 10px; letter-spacing: 0.02em; }
.confirm-msg { font-size: 13px; font-weight: 300; color: var(--ink3); line-height: 1.6; margin-bottom: 24px; }
.confirm-actions { display: flex; gap: 10px; justify-content: center; }
.btn-danger { padding: 9px 22px; background: #8A2D2D; color: #fff; border: none; font-family: var(--sans); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-radius: 1px; transition: background 0.15s; }
.btn-danger:hover { background: #6A1A1A; }

.toast {
  position: fixed; bottom: 96px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink); color: var(--cream);
  padding: 11px 24px; border-radius: 1px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  box-shadow: var(--shadow-lg); z-index: 9999;
  opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

@media (max-width: 900px) { .sidebar { display: none; } .hdr-count { display: none; } }
@media (max-width: 600px) { #masonry { columns: 2; } .main { padding: 20px 16px; } }
</style>
</head>
<body>

<a href="#main-content" class="sr-only" style="position:absolute;left:8px;top:8px;z-index:9999;background:var(--gold);color:var(--cream);padding:8px 16px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-family:var(--sans);text-decoration:none">Skip to content</a>

<header class="hdr" role="banner">
  <a href="#" class="logo" aria-label="RefBoard home">
    RefBoard<span class="logo-dot">·</span>
  </a>
  <div class="hdr-search" role="search">
    <label for="search-input" class="sr-only">Search stores</label>
    <span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
    <input type="search" id="search-input" placeholder="Search stores, categories, themes, functionality…" autocomplete="off" aria-label="Search">
  </div>
  <div class="hdr-right">
    <div class="hdr-count" aria-live="polite"><strong id="s-total">0</strong> stores · ⭐ <strong id="s-favs">0</strong> · <span style="color:var(--plus-color)">★</span> <strong id="s-plus">0</strong> plus</div>
    <button class="btn-add" onclick="openAddModal()" aria-label="Add new store" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Store
    </button>
  </div>
</header>

<div class="layout">
<aside class="sidebar" aria-label="Filters and sorting">
  <div class="sb-sec">
    <button class="sb-lbl open" onclick="toggleSec(this)" aria-expanded="true">
      <span class="sb-lbl-text">Sort by</span>
      <span class="sb-chevron">▼</span>
    </button>
    <div class="sb-sec-body" style="max-height:120px">
      <select class="sort-sel" id="sort" aria-label="Sort stores" style="margin-top:10px">
        <option value="def">Default order</option>
        <option value="ua">URL A → Z</option>
        <option value="ud">URL Z → A</option>
        <option value="ta">Theme A → Z</option>
        <option value="ca">Category A → Z</option>
      </select>
    </div>
  </div>
  <div class="sb-sec" style="padding-bottom:4px">
    <button class="sb-lbl open" onclick="toggleSec(this)" aria-expanded="true">
      <span class="sb-lbl-text">Shopify Plus</span>
      <span class="sb-chevron">▼</span>
    </button>
    <div class="sb-sec-body" style="max-height:60px;padding-top:10px">
      <button class="fb" id="plus-filter-btn" onclick="togPlus(this)" aria-pressed="false">
        <span style="color:var(--plus-color);font-size:13px;line-height:1">★</span>
        <span class="lbl">Plus stores only</span>
        <span class="cnt" id="plus-total-count">0</span>
      </button>
    </div>
  </div>
  <div class="sb-sec">
    <button class="sb-lbl open" id="cat-lbl" onclick="toggleSec(this)" aria-expanded="true">
      <span class="sb-lbl-text">Category</span>
      <span class="sb-chevron">▼</span>
    </button>
    <div class="sb-sec-body" style="max-height:600px;padding-top:8px">
      <div id="catf" role="group" aria-label="Filter by category"></div>
    </div>
  </div>
  <div class="sb-sec">
    <button class="sb-lbl" id="theme-lbl" onclick="toggleSec(this)" aria-expanded="false">
      <span class="sb-lbl-text">Theme</span>
      <span class="sb-chevron">▼</span>
    </button>
    <div class="sb-sec-body collapsed" style="max-height:600px;padding-top:8px">
      <div id="themef" role="group" aria-label="Filter by theme"></div>
    </div>
  </div>
  <div class="sb-sec" id="func-sidebar-sec">
    <button class="sb-lbl" id="func-lbl" onclick="toggleSec(this)" aria-expanded="false">
      <span class="sb-lbl-text">Functionality</span>
      <span class="sb-chevron">▼</span>
    </button>
    <div class="sb-sec-body collapsed" style="max-height:1000px;padding-top:8px">
      <div class="sheet-pills" id="sheet-pills" role="group" aria-label="Filter by sheet type"></div>
      <div class="func-list" id="funcf" role="group" aria-label="Filter by functionality"></div>
      <button class="func-more-btn" id="func-more-btn" onclick="toggleFuncMore()" style="display:none">+ Show more</button>
    </div>
  </div>
  <button class="clear-all" onclick="clearAll()">Clear filters</button>
</aside>

<main class="main" id="main-content" tabindex="-1">
  <div class="tabs" role="tablist" aria-label="View tabs">
    <button class="tab on" role="tab" aria-selected="true"  onclick="setTab('all',this)">All Stores</button>
    <button class="tab"    role="tab" aria-selected="false" onclick="setTab('func',this)">With Functionality <span class="tbadge" id="fbadge-func">0</span></button>
    <button class="tab"    role="tab" aria-selected="false" onclick="setTab('favs',this)">Saved <span class="tbadge" id="fbadge">0</span></button>
    <button class="tab"    role="tab" aria-selected="false" onclick="setTab('other',this)">Other</button>
  </div>
  <div class="toolbar">
    <div class="result-count" aria-live="polite"><strong id="rcount">0</strong> results</div>
    <button class="btn-select" id="sel-mode-btn" onclick="toggleSelectMode()" aria-pressed="false">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Select
    </button>
    <div class="vbtns" role="group" aria-label="View layout">
      <button class="vbtn" onclick="setView('g',this)" aria-label="Grid view" aria-pressed="false">▦</button>
      <button class="vbtn on" onclick="setView('l',this)" aria-label="List view" aria-pressed="true">≡</button>
    </div>
  </div>
  <div id="masonry" class="lv" role="list" aria-label="Store cards"></div>
  <div class="load-more" id="load-more-wrap" style="display:none">
    <button class="load-btn" onclick="loadMore()">Load more</button>
  </div>
</main>
</div>

<!-- SELECT BAR -->
<div class="sel-bar" id="sel-bar" role="status" aria-live="polite">
  <div class="sel-count"><span id="sel-count">0</span> selected</div>
  <div class="sel-divider"></div>
  <button class="sel-btn primary" onclick="copySelected()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    Copy URLs
  </button>
  <button class="sel-btn" onclick="selectAll()">All</button>
  <div class="sel-divider"></div>
  <button class="sel-btn" onclick="clearSelection()">Clear</button>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title" onclick="if(event.target===this)closeMod('detail-modal')">
  <div class="modal" id="detail-content" tabindex="-1"></div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-title" onclick="if(event.target===this)closeMod('add-modal')">
  <div class="modal" tabindex="-1">
    <div class="modal-head">
      <h2 class="modal-title" id="add-title">Add a store</h2>
      <button class="modal-close" onclick="closeMod('add-modal')" aria-label="Close">✕</button>

        <input class="form-input" type="url" id="add-url" placeholder="https://store.com or store.myshopify.com" required autocomplete="off">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label class="form-lbl" for="add-l1">L1 Category</label>

            <option value="">Select…</option>
            <option>Clothing &amp; Apparel</option>
            <option>Sports &amp; Outdoors</option>
            <option>Health &amp; Beauty</option>
            <option>Home &amp; Kitchen</option>
            <option>Electronics &amp; Tech</option>
            <option>Food &amp; Grocery</option>
            <option>Baby &amp; Kids</option>
            <option>Pets</option>
            <option>Jewelry &amp; Accessories</option>
            <option>Arts, Crafts &amp; Hobbies</option>
            <option>Books, Media &amp; Education</option>
            <option>Automotive</option>
            <option>Industrial &amp; B2B</option>

</div>

<!-- CONFIRM DELETE -->
<div class="modal-overlay" id="confirm-modal" role="dialog" aria-modal="true" onclick="if(event.target===this)closeMod('confirm-modal')">
  <div class="modal" style="max-width:420px" tabindex="-1" id="confirm-content"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="assertive"></div>

<script>
const ICONS={'Clothing & Apparel':'👗','Sports & Outdoors':'🏋️','Health & Beauty':'💄','Home & Kitchen':'🛋️','Electronics & Tech':'💻','Food & Grocery':'🥗','Baby & Kids':'🧸','Pets':'🐾','Jewelry & Accessories':'💍','Arts, Crafts & Hobbies':'🎨','Books, Media & Education':'📚','Automotive':'🚗','Industrial & B2B':'🏭','Travel & Luggage':'🧳','Other / Unclear':'○'};
const CAT_COL={'Clothing & Apparel':'var(--cat-clothing)','Sports & Outdoors':'var(--cat-sports)','Health & Beauty':'var(--cat-health)','Home & Kitchen':'var(--cat-home)','Electronics & Tech':'var(--cat-tech)','Food & Grocery':'var(--cat-food)','Baby & Kids':'var(--cat-baby)','Pets':'var(--cat-pets)','Jewelry & Accessories':'var(--cat-jewelry)','Arts, Crafts & Hobbies':'var(--cat-arts)','Books, Media & Education':'var(--cat-books)','Automotive':'var(--cat-auto)','Industrial & B2B':'var(--cat-biz)','Travel & Luggage':'var(--cat-travel)','Other / Unclear':'var(--cat-other)'};
const ST_LABEL={'website':'Web','app':'App','api':'API'};

let DATA=[], filtered=[], favs=new Set(JSON.parse(localStorage.getItem('rb4_favs')||'[]'));
let selected=new Set();
let filters={cat:new Set(),theme:new Set(),func:new Set(),sheet:new Set()};
let tab='all', sortK='def', q='', page=1, PG=60, selectMode=false, plusOnly=false;
let funcShowAll=false;
const FUNC_INIT_SHOW=12;

function init(d){
  const local=JSON.parse(localStorage.getItem('rb4_added')||'[]');
  DATA=[...d,...local];
  buildSidebar(); run();
  const nonFunc=DATA.filter(s=>!s._func_only);
  document.getElementById('s-total').textContent=nonFunc.length.toLocaleString();
  const plusCount=DATA.filter(s=>s.plus).length;
  document.getElementById('s-plus').textContent=plusCount.toLocaleString();
  document.getElementById('plus-total-count').textContent=plusCount.toLocaleString();
}

function buildSidebar(){
  // ── Category ──
  const catc={};
  DATA.filter(s=>!s._func_only).forEach(r=>{catc[r.l1_category]=(catc[r.l1_category]||0)+1;});
  document.getElementById('catf').innerHTML=Object.entries(catc).sort((a,b)=>b[1]-a[1]).map(([cat,n])=>
    `<button class="fb" onclick="tog('cat','${encodeURIComponent(cat)}',this)" aria-pressed="false">
      <span class="ico" aria-hidden="true" style="font-size:11px">${ICONS[cat]||'○'}</span>
      <span class="lbl">${cat}</span>
      <span class="cnt">${n.toLocaleString()}</span>
    </button>`).join('');

  // ── Theme ──
  const themc={};
  DATA.filter(s=>!s._func_only).forEach(r=>{const th=(r.theme_name||'').trim();if(th)themc[th]=(themc[th]||0)+1;});
  const themeEl=document.getElementById('themef');
  if(Object.keys(themc).length===0){
    themeEl.innerHTML='<div style="font-family:var(--mono);font-size:10px;color:var(--ink4);padding:4px 2px;letter-spacing:0.06em">No theme data yet</div>';
  } else {
    themeEl.innerHTML=Object.entries(themc).sort((a,b)=>b[1]-a[1]).map(([th,n])=>
      `<button class="fb" onclick="tog('theme','${encodeURIComponent(th)}',this)" aria-pressed="false">
        <span class="dot" style="background:var(--ink3)"></span>
        <span class="lbl">${th}</span>
        <span class="cnt">${n.toLocaleString()}</span>
      </button>`).join('');
  }

  // ── Sheet type pills ──
  const stCounts={website:0,app:0,api:0};
  DATA.forEach(s=>{(s.functionality_refs||[]).forEach(r=>{if(stCounts[r.sheet_type]!==undefined)stCounts[r.sheet_type]++;});});
  document.getElementById('sheet-pills').innerHTML=
    Object.entries(stCounts).filter(([,n])=>n>0).map(([st,n])=>
      `<button class="sheet-pill" data-st="${st}" onclick="togSheet('${st}',this)" aria-pressed="false">
        <span class="sheet-pill-dot"></span>${ST_LABEL[st]}<span style="font-size:9px;opacity:0.6"> ${n}</span>
      </button>`).join('');

  // ── Functionality names ──
  const funcC={};
  DATA.forEach(s=>{(s.functionality_refs||[]).forEach(r=>{funcC[r.functionality]=(funcC[r.functionality]||0)+1;});});
  const funcEntries=Object.entries(funcC).sort((a,b)=>b[1]-a[1]);
  const funcEl=document.getElementById('funcf');
  const moreBtn=document.getElementById('func-more-btn');

  function renderFuncList(){
    const show=funcShowAll?funcEntries:funcEntries.slice(0,FUNC_INIT_SHOW);
    funcEl.innerHTML=show.map(([fn,n])=>
      `<button class="fb" onclick="tog('func','${encodeURIComponent(fn)}',this)" aria-pressed="false">
        <span class="dot" style="background:var(--ink4)"></span>
        <span class="lbl">${fn}</span>
        <span class="cnt">${n.toLocaleString()}</span>
      </button>`).join('');
    // re-apply active states
    filters.func.forEach(fn=>{
      funcEl.querySelectorAll('.fb').forEach(b=>{
        try{if(decodeURIComponent(b.getAttribute('onclick').match(/'([^']+)'/)?.[1]||'')===fn){b.classList.add('on');b.setAttribute('aria-pressed','true');}}catch(e){}
      });
    });
    if(funcEntries.length>FUNC_INIT_SHOW){
      moreBtn.style.display='block';
      moreBtn.textContent=funcShowAll?'− Show less':`+ ${funcEntries.length-FUNC_INIT_SHOW} more`;
    } else {
      moreBtn.style.display='none';
    }
  }
  renderFuncList();
  window._renderFuncList=renderFuncList;
}

function toggleSec(lbl){
  const body=lbl.nextElementSibling;
  const isOpen=lbl.classList.contains('open');
  lbl.classList.toggle('open',!isOpen);
  lbl.setAttribute('aria-expanded',(!isOpen).toString());
  body.classList.toggle('collapsed',isOpen);
}

// Auto-open a sidebar section by its label button id
function openSec(lblId){
  const lbl=document.getElementById(lblId);
  if(!lbl) return;
  const body=lbl.nextElementSibling;
  lbl.classList.add('open');lbl.setAttribute('aria-expanded','true');
  body.classList.remove('collapsed');
}

function togPlus(btn){
  plusOnly=!plusOnly;
  btn.classList.toggle('on',plusOnly);
  btn.setAttribute('aria-pressed',plusOnly.toString());
  page=1;run();
}
funcShowAll=!funcShowAll;window._renderFuncList&&window._renderFuncList();

function tog(type,val,btn){
  const v=decodeURIComponent(val);
  if(filters[type].has(v)){filters[type].delete(v);btn.classList.remove('on');btn.setAttribute('aria-pressed','false');}
  else{filters[type].add(v);btn.classList.add('on');btn.setAttribute('aria-pressed','true');}
  if(type==='cat') openSec('cat-lbl');
  if(type==='theme') openSec('theme-lbl');
  if(type==='func') openSec('func-lbl');
  updateActiveBadges();
  page=1;run();
}

function togSheet(st,btn){
  if(filters.sheet.has(st)){filters.sheet.delete(st);btn.classList.remove('on');btn.setAttribute('aria-pressed','false');}
  else{filters.sheet.add(st);btn.classList.add('on');btn.setAttribute('aria-pressed','true');}
  openSec('func-lbl');
  updateActiveBadges();
  page=1;run();
}

function updateActiveBadges(){
  // Cat badge
  updateBadge('cat-lbl', filters.cat.size);
  updateBadge('theme-lbl', filters.theme.size);
  updateBadge('func-lbl', filters.func.size + filters.sheet.size);
}
function updateBadge(lblId, count){
  const lbl=document.getElementById(lblId);
  if(!lbl) return;
  let badge=lbl.querySelector('.sb-lbl-active');
  if(count>0){
    if(!badge){badge=document.createElement('span');badge.className='sb-lbl-active';lbl.querySelector('.sb-lbl-text').appendChild(badge);}
    badge.textContent=count;
  } else {
    if(badge) badge.remove();
  }
}

function clearAll(){
  filters={cat:new Set(),theme:new Set(),func:new Set(),sheet:new Set()};
  plusOnly=false;
  const plusBtn=document.getElementById('plus-filter-btn');
  if(plusBtn){plusBtn.classList.remove('on');plusBtn.setAttribute('aria-pressed','false');}
  document.querySelectorAll('.fb').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});
  document.querySelectorAll('.sheet-pill').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});
  q='';document.getElementById('search-input').value='';
  sortK='def';document.getElementById('sort').value='def';
  updateActiveBadges();
  page=1;run();
}

function run(){
  const hasFuncFilter=filters.func.size>0||filters.sheet.size>0;

  let d=[...DATA];

  // Tab filter
  if(tab==='favs') d=d.filter(r=>favs.has(r.original_url));
  else if(tab==='other') d=d.filter(r=>r.l1_category==='Other / Unclear'&&!r._func_only);
  else if(tab==='func') d=d.filter(r=>(r.functionality_refs||[]).length>0);
  else {
    // 'all' tab: hide func-only unless a func/sheet filter is active
    if(!hasFuncFilter) d=d.filter(r=>!r._func_only);
  }

  // Text search
  if(q){
    const ql=q.toLowerCase();
    d=d.filter(r=>(r.original_url||'').toLowerCase().includes(ql)||(r.final_url||'').toLowerCase().includes(ql)||(r.l1_category||'').toLowerCase().includes(ql)||(r.l2_category||'').toLowerCase().includes(ql)||(r.l3_category||'').toLowerCase().includes(ql)||(r.tags||'').toLowerCase().includes(ql)||(r.notes||'').toLowerCase().includes(ql)||(r.theme_name||'').toLowerCase().includes(ql)||
      (r.functionality_refs||[]).some(fr=>fr.functionality.toLowerCase().includes(ql)));
  }

  // Category filter
  if(filters.cat.size) d=d.filter(r=>filters.cat.has(r.l1_category||''));

  // Theme filter
  if(filters.theme.size) d=d.filter(r=>filters.theme.has((r.theme_name||'').trim()));

  // Sheet type filter — bring in func-only stores if needed
  if(filters.sheet.size){
    d=d.filter(r=>(r.functionality_refs||[]).some(fr=>filters.sheet.has(fr.sheet_type)));
  }

  // Functionality name filter
  if(filters.func.size){
    d=d.filter(r=>(r.functionality_refs||[]).some(fr=>filters.func.has(fr.functionality)));
  }

  // Plus only filter
  if(plusOnly) d=d.filter(r=>r.plus===true);

  // Sort
  if(sortK==='ua') d.sort((a,b)=>(a.original_url||'').localeCompare(b.original_url||''));
  if(sortK==='ud') d.sort((a,b)=>(b.original_url||'').localeCompare(a.original_url||''));
  if(sortK==='ca') d.sort((a,b)=>(a.l1_category||'').localeCompare(b.l1_category||''));
  if(sortK==='ta') d.sort((a,b)=>(a.theme_name||'zzz').localeCompare(b.theme_name||'zzz'));

  filtered=d; render(); updateStats();
}

function render(){
  const g=document.getElementById('masonry');
  const show=filtered.slice(0,PG*page);
  document.getElementById('rcount').textContent=filtered.length.toLocaleString();
  if(!filtered.length){
    g.innerHTML=`<div class="empty"><div class="empty-ico">∅</div><div class="empty-title">Nothing found</div><div class="empty-sub">Adjust your search or filters</div></div>`;
    document.getElementById('load-more-wrap').style.display='none'; return;
  }
  g.innerHTML=show.map((r,i)=>buildCard(r,i)).join('');
  document.getElementById('load-more-wrap').style.display=show.length<filtered.length?'block':'none';
}

function buildCard(r,i){
  const url=r.original_url||'';
  const finalUrl=(r.final_url&&r.final_url.startsWith('http'))?r.final_url:('https://'+(r.final_url||url));
  const raw=finalUrl.replace(/https?:\/\//,'').split('/')[0].replace(/\/$/,'');
  const isCustom=raw&&!raw.includes('myshopify.com');
  const slug=isCustom?raw:url.replace('.myshopify.com','');
  const displayName=slug.replace(/-/g,' ').replace(/\./g,' ').trim();
  const initials=displayName.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'?';
  const faviconSrc=isCustom?`https://www.google.com/s2/favicons?domain=${raw}&sz=32`:'';
  const tags=(r.tags||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,4);
  const isFav=favs.has(url); const isSel=selected.has(url);
  const ruleColor=CAT_COL[r.l1_category]||'var(--cat-other)';
  const delay=Math.min(i%28,20)*0.016;
  const enc=encodeURIComponent(url);
  const funcRefs=r.functionality_refs||[];
  // Dedupe func badges by functionality name, show up to 3
  const seen=new Set(); const badgeRefs=[];
  for(const fr of funcRefs){if(!seen.has(fr.functionality)){seen.add(fr.functionality);badgeRefs.push(fr);}if(badgeRefs.length>=3)break;}

  const funcBadgesHtml=badgeRefs.length?`<div class="func-badges">
    ${badgeRefs.map(fr=>`<span class="func-badge" data-st="${fr.sheet_type}" title="${fr.functionality}" onclick="event.stopPropagation();filterByFunc('${encodeURIComponent(fr.functionality)}')">
      <span class="func-badge-dot"></span>${fr.functionality}
    </span>`).join('')}
    ${funcRefs.length>3?`<span class="func-badge" data-st="website" style="opacity:0.5">+${funcRefs.length-3}</span>`:''}
  </div>`:'';

  return`<div class="card${isFav?' fav':''}${isSel?' sel':''}${r._func_only?' func-only':''}${r.plus?' is-plus':''}" style="animation-delay:${delay}s" role="listitem"
    onclick="handleCardClick('${enc}')"
    onkeydown="if(event.key==='Enter')handleCardClick('${enc}')"
    tabindex="0" aria-label="${displayName}">
    <div class="card-rule" style="background:${ruleColor}" aria-hidden="true"></div>
    <div class="card-body">
      <div class="card-actions" aria-hidden="true">
        ${r._func_only?'':`<button class="act-btn${isFav?' fav-on':''}" onclick="event.stopPropagation();togFav('${enc}',this)" aria-label="${isFav?'Unsave':'Save'}">${isFav?'★':'☆'}</button>`}
        <button class="act-btn${isSel?' sel-on':''}" onclick="event.stopPropagation();togSel('${enc}',this)" aria-label="${isSel?'Deselect':'Select'}">${isSel?'✓':'+'}</button>
      </div>
      <div class="card-top">
        <div class="card-ico" aria-hidden="true">${faviconSrc?`<img src="${faviconSrc}" onerror="this.style.display='none';this.parentElement.insertAdjacentText('beforeend','${initials}')" alt="">`:initials}</div>
        <div class="card-names">
          <div class="card-name">${displayName}</div>
          <div class="card-url">${isCustom?raw:url}</div>
        </div>
      </div>
      <div class="card-div"></div>
      ${!r._func_only?`<div class="cats">
        ${r.l1_category?`<span class="cp cl1">${r.l1_category}</span>`:''}
        ${r.l2_category&&r.l2_category!=='Unclear / Needs Review'?`<span class="cp cl2">${r.l2_category}</span>`:''}
        ${r.l3_category?`<span class="cp cl3">${r.l3_category}</span>`:''}
      </div>`:''}
      ${tags.length?`<div class="ctags">${tags.map(t=>`<span class="ctag">${t}</span>`).join('')}</div>`:''}
      ${r.plus?`<div class="plus-star">★ Shopify Plus</div>`:''}
      ${r.theme_name?`<div onclick="event.stopPropagation();filterByTheme('${encodeURIComponent(r.theme_name.trim())}')" class="theme-badge" title="Filter by theme: ${r.theme_name}"><span class="theme-badge-dot"></span>${r.theme_name}</div>`:''}
      ${funcBadgesHtml}
      <div class="card-foot"><a class="btn-visit" href="${finalUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Visit ↗</a></div>
    </div>
  </div>`;
}

function filterByTheme(enc){
  const th=decodeURIComponent(enc);
  filters.theme.clear();
  filters.theme.add(th);
  document.querySelectorAll('#themef .fb').forEach(b=>{
    const match=decodeURIComponent(b.getAttribute('onclick').match(/'([^']+)'/)?.[1]||'')===th;
    b.classList.toggle('on',match);b.setAttribute('aria-pressed',match.toString());
  });
  page=1;run();showToast(`Theme: ${th}`);
}

function filterByFunc(enc){
  const fn=decodeURIComponent(enc);
  filters.func.clear();filters.func.add(fn);
  if(window._renderFuncList) window._renderFuncList();
  page=1;run();showToast(`Func: ${fn}`);
}

function loadMore(){page++;render();}

function handleCardClick(enc){
  const url=decodeURIComponent(enc);
  if(selectMode){togSelByUrl(url);return;}
  const r=DATA.find(d=>d.original_url===url);
  if(r) openDetail(r);
}

function togFav(enc,btn){
  const url=decodeURIComponent(enc);
  if(favs.has(url)){favs.delete(url);btn.classList.remove('fav-on');btn.textContent='☆';btn.closest('.card').classList.remove('fav');}
  else{favs.add(url);btn.classList.add('fav-on');btn.textContent='★';btn.closest('.card').classList.add('fav');}
  localStorage.setItem('rb4_favs',JSON.stringify([...favs]));updateStats();
}

function toggleSelectMode(){
  selectMode=!selectMode;
  const btn=document.getElementById('sel-mode-btn');
  btn.classList.toggle('on',selectMode);btn.setAttribute('aria-pressed',selectMode.toString());
  btn.querySelector('svg').style.display=selectMode?'none':'inline';
  btn.childNodes[btn.childNodes.length-1].textContent=selectMode?' Cancel':' Select';
  if(!selectMode) clearSelection();
}
function togSel(enc,btn){togSelByUrl(decodeURIComponent(enc));}
function togSelByUrl(url){
  if(selected.has(url)) selected.delete(url); else selected.add(url);
  updateSelBar();render();
}
function selectAll(){filtered.slice(0,PG*page).forEach(r=>selected.add(r.original_url));updateSelBar();render();}
function clearSelection(){selected.clear();updateSelBar();render();}
function updateSelBar(){
  document.getElementById('sel-count').textContent=selected.size;
  document.getElementById('sel-bar').classList.toggle('show',selected.size>0);
}
function copySelected(){
  const urls=[...selected].map(url=>{
    const r=DATA.find(d=>d.original_url===url);
    if(!r) return 'https://'+url;
    return (r.final_url&&r.final_url.startsWith('http'))?r.final_url:'https://'+url;
  });
  navigator.clipboard.writeText(urls.join('\n')).then(()=>showToast(`${urls.length} URL${urls.length!==1?'s':''} copied`)).catch(()=>{
    const ta=document.createElement('textarea');ta.value=urls.join('\n');ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    showToast(`${urls.length} URL${urls.length!==1?'s':''} copied`);
  });
}

function openDetail(r){
  const url=r.original_url||'';
  const finalUrl=(r.final_url&&r.final_url.startsWith('http'))?r.final_url:('https://'+url);
  const raw=finalUrl.replace(/https?:\/\//,'').split('/')[0].replace(/\/$/,'');

  const enc=encodeURIComponent(url);
  const funcRefs=r.functionality_refs||[];

  const funcSection=funcRefs.length?`
    <div class="d-func-section">
      <div class="d-lbl">Functionality References <span style="font-family:var(--mono);font-size:9px;color:var(--ink4);margin-left:4px">${funcRefs.length} entr${funcRefs.length===1?'y':'ies'}</span></div>
      <div class="d-func-list">
        ${funcRefs.map(fr=>`
          <div class="d-func-item" data-st="${fr.sheet_type}">

            <div class="d-func-meta">
              <span class="d-func-st" data-st="${fr.sheet_type}">${ST_LABEL[fr.sheet_type]||fr.sheet_type}</span>
              ${fr.url&&fr.url!==finalUrl?`<a href="${fr.url}" target="_blank" rel="noopener noreferrer" class="d-func-link" onclick="event.stopPropagation()">View ↗</a>`:''}
            </div>
          </div>`).join('')}
      </div>
    </div>`:'';

  document.getElementById('detail-content').innerHTML=`
    <div class="modal-head">
      <h2 class="modal-title" id="detail-title">${displayName}${r.plus?' <span style="font-size:14px;color:var(--plus-color);vertical-align:middle" title="Shopify Plus">★</span>':''}</h2>
      <button class="modal-close" onclick="closeMod('detail-modal')" aria-label="Close">✕</button>
    </div>
    <div class="d-url-block">
      <a href="${finalUrl}" target="_blank" rel="noopener noreferrer" class="d-url-main">
        ${finalUrl}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="11" height="11" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
      ${isCustom?`<div class="d-url-orig">${url}</div>`:''}
    </div>
    <div class="d-links">
      <a href="${finalUrl}" target="_blank" rel="noopener noreferrer" class="d-link primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Visit Store
      </a>
      <a href="https://www.google.com/search?q=${encodeURIComponent(displayName+' ecommerce store')}" target="_blank" rel="noopener noreferrer" class="d-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        Google
      </a>
    </div>
    ${!r._func_only?`<div class="d-grid">
      <div class="d-field"><div class="d-lbl">L1 Category</div><div class="d-val">${r.l1_category||'—'}</div></div>
      <div class="d-field"><div class="d-lbl">L2 Sub-category</div><div class="d-val">${r.l2_category||'—'}</div></div>
      <div class="d-field"><div class="d-lbl">L3 Specific</div><div class="d-val">${r.l3_category||'—'}</div></div>
      <div class="d-field"><div class="d-lbl">Status Code</div><div class="d-val" style="font-family:var(--mono);font-size:12px">${r.status_code||'—'}</div></div>
      <div class="d-field"><div class="d-lbl">Shopify Theme</div><div class="d-val" style="font-family:var(--mono);font-size:12px">${r.theme_name||'—'}</div></div>
    </div>`:``}
    ${funcSection}
    ${r.tags?`<div class="d-tags-wrap"><div class="d-lbl">Tags</div><div class="d-tags">${r.tags.split(',').map(t=>`<span class="d-tag">${t.trim()}</span>`).join('')}</div></div>`:''}
    ${r.notes&&r.notes.length>10?`<div class="d-notes">${r.notes}</div>`:''}
    <div class="modal-actions">
      ${!r._func_only?`<button class="btn-p" id="modal-fav-btn" onclick="togModalFav('${enc}',this)">${isFav?'★ Saved':'☆ Save'}</button>`:''}

  openMod('detail-modal');

function togModalFav(enc,btn){
  const url=decodeURIComponent(enc);
  if(favs.has(url)){favs.delete(url);btn.textContent='☆ Save';}
  else{favs.add(url);btn.textContent='★ Saved';}
  localStorage.setItem('rb4_favs',JSON.stringify([...favs]));run();updateStats();
}

function confirmDelete(enc,name){
  const url=decodeURIComponent(enc);
  document.getElementById('confirm-content').innerHTML=`
    <div class="confirm-box">
      <div class="confirm-ico">—</div>
      <div class="confirm-title">Remove this store?</div>
      <div class="confirm-msg"><em style="font-family:var(--serif)">${name}</em> will be permanently removed.</div>
      <div class="confirm-actions">
        <button class="btn-danger" onclick="deleteStore('${enc}')">Remove</button>
        <button class="btn-s" onclick="closeMod('confirm-modal')">Cancel</button>
      </div>
    </div>`;
  openMod('confirm-modal');
}

function deleteStore(enc){
  const url=decodeURIComponent(enc);
  const idx=DATA.findIndex(d=>d.original_url===url);
  if(idx>-1) DATA.splice(idx,1);
  const local=JSON.parse(localStorage.getItem('rb4_added')||'[]');
  localStorage.setItem('rb4_added',JSON.stringify(local.filter(d=>d.original_url!==url)));
  favs.delete(url);selected.delete(url);
  localStorage.setItem('rb4_favs',JSON.stringify([...favs]));
  closeMod('confirm-modal');buildSidebar();run();
  document.getElementById('s-total').textContent=DATA.filter(s=>!s._func_only).length.toLocaleString();
  showToast('Store removed');
}

function openAddModal(){
  ['add-url','add-l2','add-l3','add-tags','add-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('add-l1').value='';
  openMod('add-modal');setTimeout(()=>document.getElementById('add-url').focus(),100);
}

function submitAdd(e){
  e.preventDefault();
  const raw=document.getElementById('add-url').value.trim();
  if(!raw){showToast('Please enter a URL');return;}
  const finalUrl=raw.startsWith('http')?raw:'https://'+raw;
  const origUrl=raw.replace(/https?:\/\//,'').replace(/\/$/,'');
  if(DATA.find(d=>d.original_url===origUrl)){showToast('Store already exists');return;}
  const s={original_url:origUrl,final_url:finalUrl,health:'active',status_code:200,
    l1_category:document.getElementById('add-l1').value||'Other / Unclear',
    l2_category:document.getElementById('add-l2').value||'',
    l3_category:document.getElementById('add-l3').value||'',
    tags:document.getElementById('add-tags').value,
    confidence:'medium',notes:document.getElementById('add-notes').value,
    existing_tags:'',functionality_refs:[],_added:true};
  DATA.unshift(s);
  const local=JSON.parse(localStorage.getItem('rb4_added')||'[]');
  local.unshift(s);localStorage.setItem('rb4_added',JSON.stringify(local));
  closeMod('add-modal');buildSidebar();run();
  document.getElementById('s-total').textContent=DATA.filter(s=>!s._func_only).length.toLocaleString();
  showToast('Store added');
}

function openMod(id){
  const ov=document.getElementById(id);ov.classList.add('open');ov.setAttribute('aria-hidden','false');
  const f=ov.querySelectorAll('button,a,input,select,textarea,[tabindex]:not([tabindex="-1"])');
  if(f.length) f[0].focus();document.body.style.overflow='hidden';
}
function closeMod(id){
  document.getElementById(id).classList.remove('open');
  document.getElementById(id).setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

function setTab(t,btn){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-selected','false');});
  btn.classList.add('on');btn.setAttribute('aria-selected','true');
  page=1;run();
}
function setView(v,btn){
  document.querySelectorAll('.vbtn').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false');});
  btn.classList.add('on');btn.setAttribute('aria-pressed','true');
  document.getElementById('masonry').classList.toggle('lv',v==='l');
}

document.getElementById('sort').addEventListener('change',function(){sortK=this.value;page=1;run();});
let st;
document.getElementById('search-input').addEventListener('input',function(){clearTimeout(st);st=setTimeout(()=>{q=this.value.trim();page=1;run();},180);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('detail-modal').classList.contains('open')) closeMod('detail-modal');
    else if(document.getElementById('add-modal').classList.contains('open')) closeMod('add-modal');
    else if(document.getElementById('confirm-modal').classList.contains('open')) closeMod('confirm-modal');
    else if(selectMode) toggleSelectMode();
  }
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.getElementById('search-input').focus();}
});

function updateStats(){
  const fcount=favs.size;
  document.getElementById('s-favs').textContent=fcount;
  document.getElementById('fbadge').textContent=fcount;
  const funcCount=DATA.filter(s=>(s.functionality_refs||[]).length>0).length;
  document.getElementById('fbadge-func').textContent=funcCount.toLocaleString();
  const plusCount=DATA.filter(s=>s.plus).length;
  document.getElementById('s-plus').textContent=plusCount.toLocaleString();
}

let toastT;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

fetch('stores_live.json').then(r=>r.json()).then(d=>init(d)).catch(()=>{
  document.getElementById('masonry').innerHTML=`<div class="empty"><div class="empty-ico">∅</div><div class="empty-title">Could not load data</div><div class="empty-sub">Keep index.html and stores_live.json in the same folder</div></div>`;
});
</script>
</body>
